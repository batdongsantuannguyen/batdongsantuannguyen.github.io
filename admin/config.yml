backend:
  name: github
  repo: batdongsantuannguyen/batdongsantuannguyen.github.io
  branch: main
  base_url: https://damp-bird-6663.tuannguyenbdsdalat68.workers.dev
  auth_endpoint: auth

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "properties"
    label: "Bất động sản"
    folder: "content/properties"
    create: true

    slug: "{{slug}}"

    fields:
      - label: "Loại bất động sản"
        name: "type"
        widget: "select"
        options:
          - { label: "Nhà", value: "nha" }
          - { label: "Đất", value: "dat" }
          - { label: "Biệt thự", value: "villa" }
          - { label: "Khách sạn", value: "khach-san" }
          - { label: "Căn hộ", value: "can-ho" }
          - { label: "Homestay", value: "homestay" }
          - { label: "Cho thuê", value: "cho-thue" }

      - label: "Khu vực"
        name: "location"
        widget: "select"
        options:
          - { label: "Đà Lạt", value: "da-lat" }
          - { label: "Đức Trọng", value: "duc-trong" }
          - { label: "Bảo Lộc", value: "bao-loc" }
          - { label: "Lạc Dương", value: "lac-duong" }
          - { label: "Đơn Dương", value: "don-duong" }
          - { label: "Xuân Thọ – Xuân Trường", value: "xuan-tho-xuan-truong" }
          - { label: "Lâm Hà", value: "lam-ha" }

      - label: "Tiêu đề"
        name: "title"
        widget: "string"
        hint: "SEO: Loại BĐS + khu vực + diện tích/đặc điểm mạnh + pháp lý hoặc giá. Ví dụ: Bán đất Xuân Thọ Đà Lạt 1152m², mặt tiền đường nhựa, sổ hồng riêng."
      - label: "Giá"
        name: "price"
        widget: "string"
        required: false

      - label: "Mô tả ngắn"
        name: "description"
        widget: "text"
        required: false
        hint: "SEO: Viết 1–2 câu ngắn, nêu rõ loại BĐS + khu vực + diện tích + điểm mạnh + pháp lý hoặc giá. Ví dụ: Bán đất Xuân Thọ Đà Lạt 1152m², có 400m² thổ cư, mặt tiền đường nhựa 21m, sổ hồng riêng, giá 10 tỷ."
      - label: "Ảnh đại diện"
        name: "image"
        widget: "image"
        required: false

      - label: "Thư viện hình ảnh"
        name: "images"
        widget: "image"
        required: false
        media_library:
          config:
            multiple: true
            max_files: 30

      - label: "Địa chỉ"
        name: "address"
        widget: "string"
        required: false

      - label: "Diện tích"
        name: "area"
        widget: "string"
        required: false

      - label: "Diện tích thổ cư"
        name: "residentialArea"
        widget: "string"
        required: false

      - label: "Mặt tiền"
        name: "frontage"
        widget: "string"
        required: false

      - label: "Hướng"
        name: "direction"
        widget: "string"
        required: false

      - label: "Đường"
        name: "road"
        widget: "string"
        required: false

      - label: "Pháp lý"
        name: "legal"
        widget: "string"
        required: false

      - label: "Tiền đặt cọc"
        name: "deposit"
        widget: "string"
        required: false

      - label: "Thời hạn thuê"
        name: "leaseTerm"
        widget: "string"
        required: false

      - label: "Nội thất"
        name: "furniture"
        widget: "string"
        required: false

      - label: "Tóm tắt"
        name: "summary"
        widget: "text"
        required: false
        hint: "Viết 2–4 câu nêu nhanh giá trị thực của bất động sản: vị trí, diện tích, đường/mặt tiền, pháp lý và điểm nổi bật. Không lặp nguyên văn Mô tả ngắn."
      
      - label: "Nội dung chi tiết"
        name: "content"
        widget: "markdown"
        required: false
        hint: "Viết nội dung theo thứ tự: 1) thông tin chính của BĐS, 2) vị trí và kết nối, 3) giá trị sử dụng/đầu tư, 4) pháp lý và giá bán. Ưu tiên thông tin thực tế, đoạn ngắn, dễ đọc; chèn ảnh đúng vị trí nội dung."
        editor_components:
          - "formatted-text"
          - "image"
          - "code-block"

      - label: "Ưu điểm nổi bật"
        name: "highlights"
        widget: "text"
        required: false
        hint: "Mỗi dòng là một ưu điểm nổi bật. Nên nhập 4–6 ý ngắn, cụ thể và có giá trị thực tế như: mặt tiền đường nhựa, sổ hồng riêng, có thổ cư, gần chợ/trường học, view đẹp."
       
      - label: "Hashtag / Từ khóa liên quan"
        name: "tags"
        widget: "list"
        required: false
        label_singular: "Từ khóa"
        hint: "SEO: Nên nhập 5–8 cụm từ khóa sát với bài đăng, ưu tiên loại BĐS + khu vực + đặc điểm thật. Ví dụ: đất Xuân Thọ Đà Lạt, đất thổ cư Xuân Thọ, đất sổ hồng riêng Đà Lạt. Không nhồi quá nhiều từ khóa."
        field:
          label: "Từ khóa"
          name: "tag"
          widget: "string"
      - label: "Link video YouTube"
        name: "videoId"
        widget: "string"
        required: false
