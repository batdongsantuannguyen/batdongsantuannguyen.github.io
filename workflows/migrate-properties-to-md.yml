name: Migrate properties JSON to Markdown

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert properties.json to Markdown files
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const sourceFile = "assets/data/properties.json";
          const outputDir = "content/properties";

          if (!fs.existsSync(sourceFile)) {
            console.error(`Không tìm thấy ${sourceFile}`);
            process.exit(1);
          }

          const raw = fs.readFileSync(sourceFile, "utf8");
          const properties = JSON.parse(raw);

          if (!Array.isArray(properties)) {
            console.error("properties.json phải là một mảng JSON.");
            process.exit(1);
          }

          fs.mkdirSync(outputDir, { recursive: true });

          let created = 0;
          let skipped = 0;
          let invalid = 0;

          function yamlValue(value) {
            if (value === undefined) return null;
            return JSON.stringify(value);
          }

          for (const property of properties) {
            if (
              !property ||
              !property.id ||
              String(property.id).trim() === ""
            ) {
              console.warn("Bỏ qua sản phẩm không có id:", property);
              invalid++;
              continue;
            }

            const id = String(property.id).trim();

            if (!/^[a-z0-9-]+$/.test(id)) {
              console.warn(`ID không hợp lệ, bỏ qua: ${id}`);
              invalid++;
              continue;
            }

            const filePath = path.join(outputDir, `${id}.md`);

            if (fs.existsSync(filePath)) {
              console.log(`Đã tồn tại, không ghi đè: ${filePath}`);
              skipped++;
              continue;
            }

            const lines = ["---"];

            for (const [key, value] of Object.entries(property)) {
              if (value === undefined) continue;

              const serialized = yamlValue(value);

              if (serialized === null) continue;

              lines.push(`${key}: ${serialized}`);
            }

            lines.push("---", "");

            fs.writeFileSync(
              filePath,
              lines.join("\n"),
              "utf8"
            );

            console.log(`Đã tạo: ${filePath}`);
            created++;
          }

          console.log("");
          console.log("===== KẾT QUẢ =====");
          console.log(`Đã tạo mới: ${created}`);
          console.log(`Đã tồn tại: ${skipped}`);
          console.log(`Không hợp lệ: ${invalid}`);
          console.log(`Tổng dữ liệu nguồn: ${properties.length}`);
          NODE

      - name: Commit generated Markdown files
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Không có file mới cần commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content/properties/
          git commit -m "Migrate properties to individual Markdown files"
          git push
