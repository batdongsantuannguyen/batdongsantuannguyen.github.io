name: Facebook Auto Post
on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "content/properties/*.md"

jobs:
  post-to-facebook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find and post new properties
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          python3 <<'PY'
          import os
          import re
          import json
          import subprocess
          import urllib.parse
          import urllib.request
          import urllib.error

          token = os.environ["FACEBOOK_PAGE_ACCESS_TOKEN"]
          before = os.environ["BEFORE_SHA"]
          current = os.environ["CURRENT_SHA"]

          result = subprocess.run(
              [
                  "git",
                  "diff-tree",
                  "--root",
                  "--no-commit-id",
                  "--name-only",
                  "--diff-filter=A",
                  "-r",
                  current,
                  "--",
                  "content/properties/"
              ],
              capture_output=True,
              text=True,
              check=True
          )

          files = [
              f.strip()
              for f in result.stdout.splitlines()
              if f.strip().endswith(".md")
          ]

          if not files:
              print("Không có sản phẩm mới. Không đăng Facebook.")
              raise SystemExit(0)

          def read_frontmatter(path):
              text = open(path, "r", encoding="utf-8").read()

              if not text.startswith("---"):
                  return {}

              parts = text.split("---", 2)

              if len(parts) < 3:
                  return {}

              data = {}

              for line in parts[1].splitlines():
                  match = re.match(r'^([A-Za-z][A-Za-z0-9]*):\s*(.*)$', line)

                  if not match:
                      continue

                  key = match.group(1)
                  value = match.group(2).strip()

                  if value.startswith('"') and value.endswith('"'):
                      try:
                          value = json.loads(value)
                      except Exception:
                          value = value[1:-1]

                  data[key] = value

              return data

          for path in files:
              property_data = read_frontmatter(path)

property_id = property_data.get("id", "").strip()

if not property_id:
    property_id = os.path.splitext(os.path.basename(path))[0]

title = property_data.get("title", "Bất động sản mới").strip()
price = property_data.get("price", "Liên hệ").strip()
description = property_data.get("description", "").strip()

location_code = property_data.get("location", "").strip()

location_names = {
    "da-lat": "Đà Lạt",
    "duc-trong": "Đức Trọng",
    "bao-loc": "Bảo Lộc",
    "lac-duong": "Lạc Dương",
    "don-duong": "Đơn Dương",
    "xuan-tho-xuan-truong": "Xuân Thọ – Xuân Trường",
    "lam-ha": "Lâm Hà",
}

location = property_data.get("locationName", "").strip()
if not location:
    location = location_names.get(location_code, location_code)

              detail_url = (
                  "https://tuannguyenbdsdalat68-alt.github.io/"
                  "tuannguyen-batdongsan/bat-dong-san/chi-tiet/?id="
                  + urllib.parse.quote(property_id)
              )

              message_parts = [
                  "🏡 " + title,
                  "",
              ]

              if location:
                  message_parts.append("📍 " + location)

              if price:
                  message_parts.append("💰 Giá: " + price)

              if description:
                  message_parts.extend(["", description])

              message_parts.extend([
                  "",
                  "🔗 Xem thông tin chi tiết:",
                  detail_url
              ])

              message = "\n".join(message_parts)

              payload = urllib.parse.urlencode({
                  "message": message,
                  "access_token": token
              }).encode("utf-8")

              request = urllib.request.Request(
                  "https://graph.facebook.com/v26.0/111778976892983/feed",
                  data=payload,
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(request) as response:
                      result_text = response.read().decode("utf-8")
                      print(f"Đã đăng Facebook: {path}")
                      print(result_text)

              except urllib.error.HTTPError as error:
                  error_text = error.read().decode("utf-8")
                  print(f"Lỗi Facebook khi đăng {path}:")
                  print(error_text)
                  raise

          PY
