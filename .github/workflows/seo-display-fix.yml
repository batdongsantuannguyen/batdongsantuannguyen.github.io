name: SEO Display Fix

"on":
  workflow_dispatch:
permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix generated SEO display
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const ROOT = "bat-dong-san";

          const MARKER =
            "<!-- AUTO-GENERATED BY TUAN NGUYEN SEO BUILD -->";

          const STYLE_MARKER =
            "<!-- SEO DISPLAY FIX -->";

          const iconMap = {
            "Giá": "💰",
            "Địa chỉ": "📍",
            "Diện tích": "📐",
            "Thổ cư": "🏡",
            "Mặt tiền": "↔",
            "Hướng": "🧭",
            "Đường": "🛣️",
            "Pháp lý": "📕",
            "Tiền đặt cọc": "💵",
            "Thời hạn thuê": "📅",
            "Nội thất": "🛋️"
          };

          const style = `
          ${STYLE_MARKER}

          <style>

          .property-info {
              padding: 18px;
          }

          .property-info > h2 {
              margin: -18px -18px 15px;
              padding: 12px;

              background: #d79b16;
              color: #fff;

              text-align: center;

              font-size: 18px;
              line-height: 1.35;
          }

          .property-info .info-row {
              display: grid;

              grid-template-columns:
                  30px
                  minmax(0, 1fr);

              column-gap: 10px;

              align-items: start;

              padding: 11px 0;

              border-bottom:
                  1px solid #e5e5e5;
          }

          .property-info .info-row:last-of-type {
              border-bottom: none;
          }

          .property-info .info-icon {
              display: block;

              width: 30px;

              text-align: center;

              font-size: 20px;
              line-height: 1.5;
          }

          .property-info .info-text {
              display: block;

              min-width: 0;

              line-height: 1.55;
          }

          .property-info .info-label {
              font-weight: 400;
          }

          .property-info .info-value {
              font-weight: 700;
          }

          .property-info .button {
              display: block;

              width: fit-content;

              margin: 16px auto 0;
          }

          </style>
          `;


          function walk(dir) {

              if (!fs.existsSync(dir)) {
                  return [];
              }

              const files = [];

              for (
                  const entry of
                  fs.readdirSync(
                      dir,
                      { withFileTypes: true }
                  )
              ) {

                  const full =
                      path.join(
                          dir,
                          entry.name
                      );

                  if (entry.isDirectory()) {

                      files.push(
                          ...walk(full)
                      );

                  }
                  else if (
                      entry.isFile() &&
                      entry.name === "index.html"
                  ) {

                      files.push(full);

                  }
              }

              return files;
          }


          let changed = 0;


          for (const file of walk(ROOT)) {

              let html =
                  fs.readFileSync(
                      file,
                      "utf8"
                  );


              /*
               * Chỉ xử lý trang do
               * Build SEO Pages tự sinh.
               */

              if (!html.includes(MARKER)) {
                  continue;
              }


              const before = html;


              /*
               * =========================================
               * XÓA KÝ TỰ \ THỪA
               * =========================================
               */

              html =
                  html.replace(
                      /\\(?=[\s\-*+>#])/g,
                      ""
                  );


              /*
               * =========================================
               * ICON THÔNG TIN BẤT ĐỘNG SẢN
               * =========================================
               */

              html =
                  html.replace(

                      /<div class="info-row">\s*<span>([^<]+)<\/span>\s*<strong>([^<]*)<\/strong>\s*<\/div>/g,

                      (
                          _,
                          rawLabel,
                          rawValue
                      ) => {

                          const label =
                              rawLabel.trim();

                          const value =
                              rawValue.trim();

                          const icon =
                              iconMap[label] ||
                              "•";


                                                    return `
          <div class="info-row">

              <span
                  class="info-icon"
                  aria-hidden="true">
                  ${icon}
              </span>

              <span class="info-text">

                  <span class="info-label">
                      ${label}:
                  </span>

                  <strong class="info-value">
                      ${value}
                  </strong>

              </span>

          </div>
          `;
                      }
                  );


              /*
               * =========================================
               * CSS CHO HỘP THÔNG TIN
               * =========================================
               */

              if (
                  !html.includes(
                      STYLE_MARKER
                  )
              ) {

                  html =
                      html.replace(
                          "</head>",
                          `${style}\n</head>`
                      );
              }


              if (html !== before) {

                  fs.writeFileSync(
                      file,
                      html,
                      "utf8"
                  );

                  console.log(
                      `Fixed: ${file}`
                  );

                  changed++;
              }
          }


          console.log(
              `Updated ${changed} generated SEO pages.`
          );

          NODE


      - name: Commit display fixes
        shell: bash
        run: |

          git add bat-dong-san/


          if git diff --cached --quiet; then

            echo "SEO display is already up to date."

            exit 0

          fi


          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git commit \
            -m "Fix SEO detail display"


          git push
