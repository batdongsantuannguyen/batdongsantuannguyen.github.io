name: Build properties JSON

"on":
  workflow_dispatch: {}

  push:
    branches:
      - main
    paths:
      - "content/properties/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install YAML parser
        run: npm install js-yaml

      - name: Build properties.json from Markdown
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const yaml = require("js-yaml");

          const sourceDir = "content/properties";
          const outputFile = "assets/data/properties.json";

          function parseMarkdown(filePath) {
            const text = fs.readFileSync(filePath, "utf8");

            const match = text.match(
              /^---\s*\r?\n([\s\S]*?)\r?\n---\s*(?:\r?\n)?([\s\S]*)$/
            );

            if (!match) {
              console.warn(`Skipping ${filePath}: no front matter`);
              return null;
            }

            const frontMatter = match[1];
            const body = match[2].trim();

            let data;

            try {
              data = yaml.load(frontMatter) || {};
            } catch (error) {
              console.error(`YAML error in ${filePath}`);
              console.error(error.message);
              process.exit(1);
            }

            if (body && !data.content) {
              data.content = body;
            }

            return data;
          }

          if (!fs.existsSync(sourceDir)) {
            console.error(`Folder not found: ${sourceDir}`);
            process.exit(1);
          }

          const files = fs
            .readdirSync(sourceDir)
            .filter(file => file.endsWith(".md"))
            .sort();

          const properties = files
            .map(file => {
              const filePath = path.join(sourceDir, file);
              const property = parseMarkdown(filePath);

              if (!property) return null;

              if (
                !property.id ||
                String(property.id).trim() === ""
              ) {
                property.id =
                  path.basename(file, ".md");
              }

              const oldBase =
                "/tuannguyen-batdongsan";

              if (
                property.image &&
                typeof property.image === "string"
              ) {
                property.image =
                  property.image.replace(
                    oldBase,
                    ""
                  );
              }

              if (Array.isArray(property.images)) {
                property.images =
                  property.images.map(image =>
                    typeof image === "string"
                      ? image.replace(oldBase, "")
                      : image
                  );
              }

              if (
                property.content &&
                typeof property.content === "string"
              ) {
                property.content =
                  property.content.replaceAll(
                    oldBase,
                    ""
                  );
              }

              if (
                property.url &&
                typeof property.url === "string"
              ) {
                property.url =
                  property.url.replace(
                    oldBase,
                    ""
                  );
              }

              if (Array.isArray(property.tags)) {
                property.tags =
                  property.tags
                    .map(tag =>
                      String(tag).trim()
                    )
                    .filter(Boolean);
              }

              if (typeof property.highlights === "string") {
                property.highlights =
                  property.highlights
                    .split(/\r?\n/)
                    .map(item => item.trim())
                    .filter(Boolean);
              
              } else if (Array.isArray(property.highlights)) {
                property.highlights =
                  property.highlights
                    .map(item => String(item).trim())
                    .filter(Boolean);
              
              } else if (property.highlights == null) {
                property.highlights = [];
              
              } else {
                property.highlights =
                  [String(property.highlights).trim()]
                    .filter(Boolean);
              }

              return property;
            })
            .filter(Boolean);

          if (properties.length === 0) {
            console.error(
              "No properties found."
            );
            process.exit(1);
          }

          fs.mkdirSync(
            path.dirname(outputFile),
            { recursive: true }
          );

          fs.writeFileSync(
            outputFile,
            JSON.stringify(
              properties,
              null,
              2
            ) + "\n",
            "utf8"
          );

          console.log(
            `Built ${properties.length} properties.`
          );

          properties.forEach(property => {
            console.log(
              property.id,
              "tags:",
              Array.isArray(property.tags)
                ? property.tags
                : []
            );
          });
          NODE

      - name: Commit generated properties.json
        shell: bash
        run: |
          if git diff --quiet -- assets/data/properties.json; then
            echo "properties.json is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/data/properties.json
          git commit -m "Build properties.json from CMS entries"
          
          git pull --rebase origin main
          git push origin main
