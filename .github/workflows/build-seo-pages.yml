name: Build SEO Pages

"on":
  workflow_dispatch:

  workflow_run:
    workflows:
      - "Build properties JSON"
    types:
      - completed

permissions:
  contents: write

jobs:
  build:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate SEO pages
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const SITE = "https://batdongsantuannguyen.github.io";
          const DATA_FILE = "assets/data/properties.json";
          const MARKER = "<!-- AUTO-GENERATED BY TUAN NGUYEN SEO BUILD -->";

          if (!fs.existsSync(DATA_FILE)) {
            console.error(`Không tìm thấy ${DATA_FILE}`);
            process.exit(1);
          }

          const properties = JSON.parse(
            fs.readFileSync(DATA_FILE, "utf8")
          );

          if (!Array.isArray(properties) || properties.length === 0) {
            console.error("Không có dữ liệu bất động sản.");
            process.exit(1);
          }

          function escapeHtml(value = "") {
            return String(value)
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;")
              .replace(/'/g, "&#039;");
          }

          function stripMarkdown(value = "") {
            return String(value)
              .replace(/!\[[^\]]*\]\([^)]+\)/g, " ")
              .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
              .replace(/https?:\/\/\S+/g, " ")
              .replace(/\\+/g, " ")
              .replace(/[#>*_`~\-]+/g, " ")
              .replace(/\s+/g, " ")
              .trim();
          }

          function truncate(value, length = 160) {
            const text = String(value || "").trim();

            if (text.length <= length) {
              return text;
            }

            return text.slice(0, length - 1).trim() + "…";
          }

          function slugify(value = "") {
            return String(value)
              .normalize("NFD")
              .replace(/[\u0300-\u036f]/g, "")
              .replace(/đ/g, "d")
              .replace(/Đ/g, "D")
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, "-")
              .replace(/^-+|-+$/g, "")
              .replace(/-+/g, "-");
          }

          function normalizeType(type = "") {
            const allowed = [
              "nha",
              "dat",
              "villa",
              "khach-san",
              "can-ho",
              "homestay",
              "cho-thue"
            ];

            return allowed.includes(type)
              ? type
              : "bat-dong-san";
          }

          function typeName(type) {
            const names = {
              nha: "Nhà",
              dat: "Đất",
              villa: "Biệt Thự",
              "khach-san": "Khách Sạn",
              "can-ho": "Căn Hộ",
              homestay: "Homestay",
              "cho-thue": "Cho Thuê"
            };

            return names[type] || "Bất Động Sản";
          }

          function getSeoPath(property) {
            /*
             * Nếu bài đã có URL tĩnh chuẩn trong property.url,
             * ưu tiên giữ nguyên để không phá liên kết cũ.
             */
            if (
              property.url &&
              typeof property.url === "string"
            ) {
              let existing = property.url.trim();

              if (
                existing.startsWith("/") &&
                !existing.includes("?") &&
                !existing.includes("/chi-tiet/")
              ) {
                existing = existing
                  .replace(/^\/+/, "")
                  .replace(/\/+$/, "");

                return existing;
              }
            }

            const type = normalizeType(property.type);

            const source =
              property.id ||
              property.title ||
              "bat-dong-san";

            const slug =
              slugify(source) ||
              "bat-dong-san";

            return `bat-dong-san/${type}/${slug}`;
          }

          function getDescription(property) {
            const source =
              property.description ||
              property.summary ||
              stripMarkdown(property.content || "") ||
              `${property.title || "Bất động sản"} - Tuấn Nguyên Bất Động Sản`;

            return truncate(stripMarkdown(source), 160);
          }

          function absoluteUrl(value = "") {
            const text = String(value || "").trim();

            if (!text) return "";

            if (/^https?:\/\//i.test(text)) {
              return text;
            }

            return SITE + "/" + text.replace(/^\/+/, "");
          }

          function normalizeHighlights(value) {
            if (!value) return [];

            const source = Array.isArray(value)
              ? value
              : String(value).split(/\r?\n/);

            return source
              .map(item =>
                String(item)
                  .trim()
                  .replace(/^[-*•]\s*/, "")
                  .trim()
              )
              .filter(Boolean);
          }

          function renderInline(value = "") {
            let text = escapeHtml(value);

            text = text.replace(
              /\*\*(.+?)\*\*/g,
              "<strong>$1</strong>"
            );

            text = text.replace(
              /\*(.+?)\*/g,
              "<em>$1</em>"
            );

            text = text.replace(
              /\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,
              '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
            );

            text = text.replace(
              /&lt;(https?:\/\/[^&]+)&gt;/g,
              '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>'
            );

            return text;
          }
          function renderMarkdown(markdown = "") {
            const source = String(markdown || "")
              .replace(/\r\n/g, "\n");

            if (!source.trim()) {
              return "";
            }

            /*
             * :::format do Decap CMS tạo.
             */
            const formattedBlocks = [];

            let prepared = source.replace(
              /:::format align="(left|center|right|justify)" line="(1\.4|1\.6|1\.8|2\.0)"\n([\s\S]*?)\n:::/g,
              (_, align, line, body) => {
                const token =
                  `___FORMATTED_BLOCK_${formattedBlocks.length}___`;

                formattedBlocks.push(
                  `<div class="formatted-text" style="text-align:${align};line-height:${line};">${renderMarkdown(body)}</div>`
                );

                return token;
              }
            );

            /*
             * Loại bỏ dấu "\" thừa do dữ liệu Decap cũ tạo ra.
             * Chỉ xử lý "\" đứng cuối dòng hoặc đứng một mình.
             */
            prepared = prepared
              .split("\n")
              .map(line => {
                const trimmed = line.trim();

                if (trimmed === "\\") {
                  return "";
                }

                return line.replace(/\s*\\\s*$/, "");
              })
              .join("\n");

            /*
             * Ảnh Markdown.
             */
             prepared = prepared.replace(
              /!\[([^\]]*)\]\(\s*(\S+?)(?:\s+["']([^"']*)["'])?\s*\)/g,
              (_, alt, src, title) => {
                const imageAlt =
                  String(alt || title || "").trim();
            
                return `\n<figure class="article-image"><img src="${escapeHtml(src)}" alt="${escapeHtml(imageAlt)}" loading="lazy">${imageAlt ? `<figcaption>${escapeHtml(imageAlt)}</figcaption>` : ""}</figure>\n`;
              }
            );

            const lines = prepared.split("\n");
            const html = [];

            let paragraph = [];
            let list = [];

            function flushParagraph() {
              if (paragraph.length === 0) return;

              html.push(
                `<p>${paragraph
                  .map(line => renderInline(line))
                  .join("<br>")}</p>`
              );

              paragraph = [];
            }

            function flushList() {
              if (list.length === 0) return;

              html.push(
                `<ul>${list
                  .map(item => `<li>${renderInline(item)}</li>`)
                  .join("")}</ul>`
              );

              list = [];
            }

            for (const rawLine of lines) {
              const line = rawLine.trim();
          
              if (!line) {
                flushParagraph();
                flushList();
                continue;
              }
          
              if (/^___FORMATTED_BLOCK_\d+___$/.test(line)) {
                flushParagraph();
                flushList();
          
                const index = Number(
                  line.match(/\d+/)[0]
                );
          
                html.push(formattedBlocks[index]);
                continue;
              }
          
              if (line.startsWith("<figure")) {
                flushParagraph();
                flushList();
                html.push(line);
                continue;
              }
          
              const heading = line.match(/^(#{1,6})\s+(.+)$/);
          
              if (heading) {
                flushParagraph();
                flushList();
          
                const level = Math.min(
                  heading[1].length + 1,
                  6
                );
          
                html.push(
                  `<h${level}>${renderInline(heading[2])}</h${level}>`
                );
          
                continue;
              }
          
              const listItem = line.match(/^[-*•]\s+(.+)$/);
          
              if (listItem) {
                flushParagraph();
                list.push(listItem[1]);
                continue;
              }
          
              if (/^<[^>]+>/.test(line)) {
                flushParagraph();
                flushList();
                html.push(line);
                continue;
              }
          
              paragraph.push(line);
            }
          
            flushParagraph();
            flushList();
          
            return html.join("\n");
          }

          function youtubeId(value = "") {
            const text = String(value || "").trim();

            if (/^[A-Za-z0-9_-]{11}$/.test(text)) {
              return text;
            }

            const patterns = [
              /youtu\.be\/([A-Za-z0-9_-]{11})/,
              /[?&]v=([A-Za-z0-9_-]{11})/,
              /\/shorts\/([A-Za-z0-9_-]{11})/,
              /\/embed\/([A-Za-z0-9_-]{11})/
            ];

            for (const pattern of patterns) {
              const match = text.match(pattern);

              if (match) return match[1];
            }

            return "";
          }
          
          function infoRow(icon, label, value) {
            if (!value) return "";
          
            return `
              <div class="info-row">
                <span class="info-icon">${icon}</span>
                <span class="info-label">${escapeHtml(label)}</span>
                <strong class="info-value">${escapeHtml(value)}</strong>
              </div>
            `;
          }

          function buildPage(property, canonicalPath) {
            const title =
              String(property.title || "Bất động sản").trim();

            const description =
              getDescription(property);

            const canonical =
              `${SITE}/${canonicalPath}/`;

            const image =
              absoluteUrl(property.image || "");

            const categoryName =
              typeName(property.type);

            const highlights =
              normalizeHighlights(property.highlights);
            const tags =
                Array.isArray(property.tags)
                    ? property.tags
                        .map(tag => String(tag).trim())
                        .filter(Boolean)
                    : [];
            
            const tagsHtml =
                tags.length
                    ? `
                      <div class="tags">
                        ${tags
                          .map(tag => `
                            <a
                              href="/bat-dong-san/?tag=${encodeURIComponent(tag)}"
                              class="tag-link"
                            >
                              ${escapeHtml(tag)}
                            </a>
                          `)
                          .join("")}
                      </div>
                    `
                    : "";
                        const highlightsHtml =
                          highlights.length
                            ? `
                              <div class="sidebar-box highlights-box">
                                <h2>ƯU ĐIỂM NỔI BẬT</h2>
            
                                <ul class="property-highlights">
                                  ${highlights
                                    .map(item =>
                                      `<li>${escapeHtml(item)}</li>`
                                    )
                                    .join("\n")}
                                </ul>
                              </div>
                            `
                            : "";
            
                        const propertyInfo = [
                          infoRow("💰", "Giá", property.price),
                          infoRow("📍", "Địa chỉ", property.address),
                          infoRow("📐", "Diện tích", property.area),
                          infoRow("🏡", "Thổ cư", property.residentialArea),
                          infoRow("↔️", "Mặt tiền", property.frontage),
                          infoRow("🧭", "Hướng", property.direction),
                          infoRow("🛣️", "Đường", property.road),
                          infoRow("📕", "Pháp lý", property.legal),
                          infoRow("💵", "Tiền đặt cọc", property.deposit),
                          infoRow("📅", "Thời hạn thuê", property.leaseTerm),
                          infoRow("🪑", "Nội thất", property.furniture)
                        ].join("");
            
                        const summary =
                          property.summary ||
                          property.description ||
                          "";
            
                        const contentHtml =
                          renderMarkdown(property.content || "");
            
                        const video =
                          youtubeId(property.videoId || "");
            
                        const videoHtml =
                          video
                            ? `
                              <div class="video-wrap">
                                <iframe
                                  src="https://www.youtube.com/embed/${video}"
                                  title="${escapeHtml(title)}"
                                  loading="lazy"
                                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                                  allowfullscreen>
                                </iframe>
                              </div>
                            `
                            : "";

            const breadcrumbSchema = {
              "@context": "https://schema.org",
              "@type": "BreadcrumbList",
              "itemListElement": [
                {
                  "@type": "ListItem",
                  "position": 1,
                  "name": "Trang chủ",
                  "item": `${SITE}/`
                },
                {
                  "@type": "ListItem",
                  "position": 2,
                  "name": "Bất động sản",
                  "item": `${SITE}/bat-dong-san/`
                },
                {
                  "@type": "ListItem",
                  "position": 3,
                  "name": categoryName,
                  "item": `${SITE}/bat-dong-san/${normalizeType(property.type)}/`
                },
                {
                  "@type": "ListItem",
                  "position": 4,
                  "name": title,
                  "item": canonical
                }
              ]
            };

            return `<!DOCTYPE html>
          <html lang="vi">

          <head>

          <meta charset="UTF-8">

          <meta name="viewport"
                content="width=device-width, initial-scale=1.0">

          <title>${escapeHtml(title)} | Tuấn Nguyên BĐS</title>

          <meta name="description"
                content="${escapeHtml(description)}">

          <meta name="robots"
                content="index, follow">

          <link rel="canonical"
                href="${escapeHtml(canonical)}">

          <meta property="og:locale"
                content="vi_VN">

          <meta property="og:type"
                content="article">

          <meta property="og:title"
                content="${escapeHtml(title)}">

          <meta property="og:description"
                content="${escapeHtml(description)}">

          <meta property="og:url"
                content="${escapeHtml(canonical)}">

          ${image
            ? `<meta property="og:image" content="${escapeHtml(image)}">`
            : ""
          }

          <link rel="stylesheet"
                href="/assets/css/style.css">

          <script type="application/ld+json">
          ${JSON.stringify(breadcrumbSchema, null, 2)}
          </script>

          </head>

          <body>

          ${MARKER}

          <header>

          <div class="header-container">

          <div class="logo brand-two-lines">
            <span class="brand-line">BẤT ĐỘNG SẢN</span>
            <span class="brand-line">TUẤN NGUYÊN</span>
          </div>

          <nav>

          <a href="/">Trang chủ</a>
          <a href="/bat-dong-san/">Bất động sản</a>
          <a href="/bat-dong-san/nha/">Nhà</a>
          <a href="/bat-dong-san/dat/">Đất</a>
          <a href="/bat-dong-san/villa/">Biệt Thự</a>
          <a href="/bat-dong-san/khach-san/">Khách sạn</a>
          <a href="/bat-dong-san/can-ho/">Căn hộ</a>
          <a href="/bat-dong-san/homestay/">Homestay</a>
          <a href="/bat-dong-san/cho-thue/">Cho thuê</a>

          </nav>

          </div>

          </header>

          <div class="page-wrap">

          <div class="breadcrumb">
            <a href="/">Trang chủ</a>
            <span>/</span>
            <a href="/bat-dong-san/">Bất động sản</a>
            <span>/</span>
            <a href="/bat-dong-san/${normalizeType(property.type)}/">
              ${escapeHtml(categoryName)}
            </a>
            <span>/</span>
            <span>${escapeHtml(title)}</span>
          </div>

          <div class="content-layout">

          <article class="property-article">

          <h1>${escapeHtml(title)}</h1>

          <div class="article-meta">
            Tác giả: Tuấn Nguyên
          </div>
          
          ${tagsHtml}
          
          ${summary
            ? `<div class="property-summary">${renderInline(summary)}</div>`
            : ""
          }

          <div class="property-content">
            ${contentHtml}
          </div>

          ${videoHtml}
          <div class="social-share">
          
            <a class="share-button facebook"
               href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(canonical)}"
               target="_blank"
               rel="noopener noreferrer"
               aria-label="Chia sẻ Facebook">f</a>
          
            <a class="share-button messenger"
               href="https://www.facebook.com/dialog/send?link=${encodeURIComponent(canonical)}"
               target="_blank"
               rel="noopener noreferrer"
               aria-label="Chia sẻ Messenger">💬</a>
          
            <button class="share-button copy-link"
                    type="button"
                    onclick="navigator.clipboard.writeText(window.location.href)"
                    aria-label="Sao chép liên kết">🔗</button>
          
          </div>
          </article>

          <aside class="sidebar">
          
          ${highlightsHtml}
          
          <div class="sidebar-box property-info-box">
            <h2>THÔNG TIN BẤT ĐỘNG SẢN</h2>
          
            <div class="property-info-list">
              ${propertyInfo}
            </div>
          </div>
          
          <a class="sidebar-action"
             href="tel:0843156768">
            📞 084 315 67 68
          </a>
          
          <a class="sidebar-action"
             href="https://zalo.me/0843156768"
             target="_blank"
             rel="noopener noreferrer">
            💬 Zalo
          </a>
          
          </aside>

          </div>

          </div>

          <footer>

          <p>
          © 2026 Tuấn Nguyên Bất Động Sản
          </p>

          <p>
          Đà Lạt – Lâm Đồng
          </p>

          </footer>

          </body>

          </html>
          `;
          }

          let generated = 0;
          let protectedPages = 0;

          for (const property of properties) {
            if (!property || !property.title) {
              continue;
            }

            const seoPath = getSeoPath(property);

            if (!seoPath) {
              continue;
            }

            const outputDir = seoPath;
            const outputFile =
              path.join(outputDir, "index.html");

            /*
             * Bảo vệ trang viết tay.
             *
             * Nếu file đã tồn tại nhưng không có MARKER,
             * workflow tuyệt đối không ghi đè.
             */
            if (fs.existsSync(outputFile)) {
              const current =
                fs.readFileSync(outputFile, "utf8");

              if (!current.includes(MARKER)) {
                console.log(
                  `Protected manual page: ${outputFile}`
                );

                protectedPages++;
                continue;
              }
            }

            fs.mkdirSync(
              outputDir,
              { recursive: true }
            );

            fs.writeFileSync(
              outputFile,
              buildPage(property, seoPath),
              "utf8"
            );

            console.log(
              `Generated: ${outputFile}`
            );

            generated++;
          }
              /*
               * =========================================
               * TỰ ĐỘNG TẠO SITEMAP
               * =========================================
               */
              
              const sitemapUrls = new Set([
                `${SITE}/`,
                `${SITE}/bat-dong-san/`,
                `${SITE}/bat-dong-san/nha/`,
                `${SITE}/bat-dong-san/dat/`,
                `${SITE}/bat-dong-san/villa/`,
                `${SITE}/bat-dong-san/khach-san/`,
                `${SITE}/bat-dong-san/can-ho/`,
                `${SITE}/bat-dong-san/homestay/`,
                `${SITE}/bat-dong-san/cho-thue/`,
              
                /*
                 * Giữ các trang SEO viết tay hiện có.
                 */
                `${SITE}/bat-dong-san/nha/nha-trung-tam-da-lat/`,
                `${SITE}/bat-dong-san/dat/dat-me-linh-nam-ban-180m2-1-6-ty/`,
                `${SITE}/bat-dong-san/cho-thue/cho-thue-nha-trung-tam-da-lat/`
              ]);
              
              for (const property of properties) {
              
                if (!property || !property.title) {
                  continue;
                }
              
                const seoPath = getSeoPath(property);
              
                if (!seoPath) {
                  continue;
                }
              
                sitemapUrls.add(
                  `${SITE}/${seoPath.replace(/^\/+|\/+$/g, "")}/`
                );
              }
              
              const sitemap =
              `<?xml version="1.0" encoding="UTF-8"?>
              
              <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
              
              ${Array.from(sitemapUrls)
                .map(url => `  <url>
                  <loc>${url}</loc>
                </url>`)
                .join("\n\n")}
              
              </urlset>
              `;
              
              fs.writeFileSync(
                "sitemap.xml",
                sitemap,
                "utf8"
              );
              
              console.log(
                `Sitemap updated with ${sitemapUrls.size} URLs.`
              );
          console.log(
            `Generated/updated ${generated} SEO pages.`
          );

          console.log(
            `Protected ${protectedPages} manual pages.`
          );
          NODE

      - name: Commit generated SEO pages
        shell: bash
        run: |
          git add bat-dong-san/ sitemap.xml

          if git diff --cached --quiet; then
            echo "SEO pages are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Build SEO property pages"
          git push
